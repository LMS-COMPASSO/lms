<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Usuários — LMS BNCC Computação</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="conteudo">
      <div id="topbar-container"></div>

      <div class="cartao">
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <select id="filtro-perfil">
              <option value="">Todos os perfis</option>
              <option value="administrador">Administrador</option>
              <option value="instrutor">Instrutor</option>
              <option value="aluno">Aluno</option>
            </select>
            <input type="text" id="busca" placeholder="Buscar por nome/email" />
          </div>
          <button class="btn btn-primario" onclick="abrirModalUsuario()">+ Novo Usuário</button>
        </div>
      </div>

      <div class="cartao tabela-scroll">
        <table>
          <thead><tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Status</th><th>Criado em</th><th></th></tr></thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal-usuario" class="oculto" style="position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;">
    <div class="cartao" style="max-width:420px; width:100%;">
      <h3 id="titulo-modal">Novo Usuário</h3>
      <form id="form-usuario">
        <input type="hidden" id="usuario-id" />
        <div class="form-grupo"><label>Nome</label><input type="text" id="usuario-nome" required /></div>
        <div class="form-grupo"><label>Email</label><input type="email" id="usuario-email" required /></div>
        <div class="form-grupo" id="grupo-senha"><label>Senha</label><input type="password" id="usuario-senha" minlength="6" /></div>
        <div class="form-grupo">
          <label>Perfil</label>
          <select id="usuario-perfil">
            <option value="aluno">Aluno</option>
            <option value="instrutor">Instrutor</option>
            <option value="administrador">Administrador</option>
          </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button type="submit" class="btn btn-primario">Salvar</button>
          <button type="button" class="btn btn-neutro" onclick="fecharModalUsuario()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    exigirAutenticacao(['administrador']);
    montarLayout('usuarios');
    document.getElementById('titulo-pagina').textContent = 'Usuários';

    function montarQuery() {
      const params = new URLSearchParams();
      const perfil = document.getElementById('filtro-perfil').value;
      const busca = document.getElementById('busca').value;
      if (perfil) params.set('perfil', perfil);
      if (busca) params.set('busca', busca);
      return params.toString();
    }

    async function carregar() {
      const usuarios = await api(`/usuarios?${montarQuery()}`);
      const corpo = document.getElementById('corpo-tabela');
      if (usuarios.length === 0) {
        corpo.innerHTML = '<tr><td colspan="6" style="color:#a0aec0;">Nenhum usuário encontrado.</td></tr>';
        return;
      }
      corpo.innerHTML = usuarios.map((u) => `
        <tr>
          <td>${u.nome}</td>
          <td>${u.email}</td>
          <td><span class="badge badge-${u.perfil}">${u.perfil}</span></td>
          <td>${u.ativo ? '✅ Ativo' : '⛔ Inativo'}</td>
          <td>${formatarData(u.criado_em)}</td>
          <td>
            <button class="btn btn-neutro" style="font-size:.75rem;" onclick='editarUsuario(${JSON.stringify(u)})'>Editar</button>
            ${u.ativo ? `<button class="btn btn-perigo" style="font-size:.75rem;" onclick="desativar(${u.id})">Desativar</button>` : ''}
          </td>
        </tr>
      `).join('');
    }

    function abrirModalUsuario() {
      document.getElementById('titulo-modal').textContent = 'Novo Usuário';
      document.getElementById('form-usuario').reset();
      document.getElementById('usuario-id').value = '';
      document.getElementById('grupo-senha').classList.remove('oculto');
      document.getElementById('usuario-senha').required = true;
      document.getElementById('modal-usuario').classList.remove('oculto');
    }
    function fecharModalUsuario() { document.getElementById('modal-usuario').classList.add('oculto'); }

    function editarUsuario(u) {
      document.getElementById('titulo-modal').textContent = 'Editar Usuário';
      document.getElementById('usuario-id').value = u.id;
      document.getElementById('usuario-nome').value = u.nome;
      document.getElementById('usuario-email').value = u.email;
      document.getElementById('usuario-perfil').value = u.perfil;
      document.getElementById('grupo-senha').classList.add('oculto');
      document.getElementById('usuario-senha').required = false;
      document.getElementById('modal-usuario').classList.remove('oculto');
    }

    document.getElementById('form-usuario').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('usuario-id').value;
      const nome = document.getElementById('usuario-nome').value;
      const email = document.getElementById('usuario-email').value;
      const perfil = document.getElementById('usuario-perfil').value;
      const senha = document.getElementById('usuario-senha').value;

      try {
        if (id) {
          await api(`/usuarios/${id}`, { method: 'PUT', body: JSON.stringify({ nome, email, perfil }) });
        } else {
          await api('/usuarios', { method: 'POST', body: JSON.stringify({ nome, email, perfil, senha }) });
        }
        fecharModalUsuario();
        carregar();
      } catch (err) { alert(err.message); }
    });

    async function desativar(id) {
      if (!confirm('Desativar este usuário?')) return;
      try {
        await api(`/usuarios/${id}`, { method: 'DELETE' });
        carregar();
      } catch (err) { alert(err.message); }
    }

    document.getElementById('filtro-perfil').addEventListener('change', carregar);
    document.getElementById('busca').addEventListener('input', () => {
      clearTimeout(window._t);
      window._t = setTimeout(carregar, 350);
    });

    carregar().catch((e) => alert(e.message));
  </script>
</body>
</html>
