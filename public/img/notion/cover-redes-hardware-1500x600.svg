<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" role="img" aria-labelledby="red-title red-desc">
  <title id="red-title">Redes e Hardware — Capa Notion</title>
  <desc id="red-desc">Capa temática 1500x600 com diagrama de CPU e pacotes TCP/IP na zona segura central 900x350.</desc>
  <defs>
    <linearGradient id="bg-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061e12"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <pattern id="pcb-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.5" fill="#6ee7b7" fill-opacity="0.22"/>
      <path d="M 0 24 H 20 M 28 24 H 48" stroke="#10b981" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1500" height="600" fill="url(#bg-red)"/>
  <rect width="1500" height="600" fill="url(#pcb-grid)"/>

  <g id="safe-zone" data-safe-area="300 125 900 350">
    <rect x="328" y="168" width="168" height="32" rx="16" fill="#047857" fill-opacity="0.35" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="412" y="189" text-anchor="middle" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">EIXO 2 · BNCC</text>
    <text x="328" y="254" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="40" font-weight="800" fill="#f8fafc">Redes &amp; Hardware</text>
    <text x="328" y="294" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" fill="#cbd5e1">Arquitetura de computadores, barramentos,</text>
    <text x="328" y="320" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" fill="#cbd5e1">ciclo da CPU e roteamento de pacotes na rede.</text>

    <!-- Topologia CPU + Nós TCP/IP -->
    <g transform="translate(836, 158)">
      <rect x="0" y="0" width="320" height="280" rx="20" fill="#090e1a" fill-opacity="0.82" stroke="#10b981" stroke-width="2"/>
      <!-- Barramento conectando nós -->
      <path d="M 88 94 L 160 144 L 232 94 M 160 144 V 214" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
      <!-- CPU Central -->
      <rect x="122" y="106" width="76" height="76" rx="14" fill="#065f46" stroke="#6ee7b7" stroke-width="2.5"/>
      <rect x="140" y="124" width="40" height="40" rx="6" fill="#0b1120" stroke="#a7f3d0" stroke-width="1.5"/>
      <text x="160" y="149" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="700" fill="#6ee7b7">CPU</text>
      <!-- Pinos -->
      <path d="M 146 96 V 106 M 174 96 V 106 M 146 182 V 192 M 174 182 V 192 M 112 130 H 122 M 112 158 H 122 M 198 130 H 208 M 198 158 H 208" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
      <!-- Nós de Rede -->
      <circle cx="80" cy="84" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="80" y="89" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#7dd3fc">RAM</text>
      <circle cx="240" cy="84" r="24" fill="#1e293b" stroke="#6ee7b7" stroke-width="2"/>
      <text x="240" y="89" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#6ee7b7">SSD</text>
      <rect x="104" y="212" width="112" height="36" rx="18" fill="#047857" fill-opacity="0.4" stroke="#6ee7b7" stroke-width="1.5"/>
      <text x="160" y="235" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" fill="#f8fafc">TCP/IP · I/O</text>
    </g>
  </g>
</svg>
