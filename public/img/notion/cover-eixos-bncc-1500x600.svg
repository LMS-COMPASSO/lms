<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" role="img" aria-labelledby="eixos-title eixos-desc">
  <title id="eixos-title">Três Eixos da BNCC Computação — Capa Notion</title>
  <desc id="eixos-desc">Banner 1500x600 com os três eixos curriculares posicionados na zona segura central 900x350.</desc>
  <defs>
    <linearGradient id="bg-eixos" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
    <pattern id="dot-matrix" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="#94a3b8" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1500" height="600" fill="url(#bg-eixos)"/>
  <rect width="1500" height="600" fill="url(#dot-matrix)"/>

  <!-- Zona Segura Central: 900x350px (x=300..1200, y=125..475) -->
  <g id="safe-zone" data-safe-area="300 125 900 350">
    <text x="750" y="176" text-anchor="middle" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Trilhas da BNCC Computação</text>
    <text x="750" y="206" text-anchor="middle" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="16" fill="#94a3b8">Resolução CNE/CEB nº 1/2022 · Equilíbrio de Telas CNE nº 2/2025</text>

    <!-- Card 1: Pensamento Computacional -->
    <g transform="translate(320, 236)">
      <rect x="0" y="0" width="268" height="214" rx="16" fill="#1e293b" fill-opacity="0.72" stroke="#1d4ed8" stroke-width="2"/>
      <rect x="20" y="20" width="44" height="44" rx="10" fill="#1d4ed8" fill-opacity="0.28" stroke="#93c5fd" stroke-width="1.5"/>
      <path d="M 32 34 H 52 M 32 42 H 46 M 32 50 H 52" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
      <text x="20" y="96" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Pensamento</text>
      <text x="20" y="118" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" font-weight="700" fill="#93c5fd">Computacional</text>
      <text x="20" y="154" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">Algoritmos, Decomposição</text>
      <text x="20" y="174" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">e Laboratório 3D Python</text>
    </g>

    <!-- Card 2: Mundo Digital -->
    <g transform="translate(616, 236)">
      <rect x="0" y="0" width="268" height="214" rx="16" fill="#1e293b" fill-opacity="0.72" stroke="#047857" stroke-width="2"/>
      <rect x="20" y="20" width="44" height="44" rx="10" fill="#047857" fill-opacity="0.28" stroke="#6ee7b7" stroke-width="1.5"/>
      <rect x="33" y="33" width="18" height="18" rx="3" fill="none" stroke="#6ee7b7" stroke-width="2"/>
      <path d="M 38 29 V 33 M 46 29 V 33 M 38 51 V 55 M 46 51 V 55 M 29 38 H 33 M 29 46 H 33 M 51 38 H 55 M 51 46 H 55" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
      <text x="20" y="96" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Mundo</text>
      <text x="20" y="118" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" font-weight="700" fill="#6ee7b7">Digital</text>
      <text x="20" y="154" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">Hardware 3D, Ciclo da CPU</text>
      <text x="20" y="174" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">e Redes TCP/IP</text>
    </g>

    <!-- Card 3: Cultura Digital -->
    <g transform="translate(912, 236)">
      <rect x="0" y="0" width="268" height="214" rx="16" fill="#1e293b" fill-opacity="0.72" stroke="#b45309" stroke-width="2"/>
      <rect x="20" y="20" width="44" height="44" rx="10" fill="#b45309" fill-opacity="0.28" stroke="#fcd34d" stroke-width="1.5"/>
      <path d="M 42 29 L 53 34 V 43 C 53 49 48 53 42 56 C 36 53 31 49 31 43 V 34 Z" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 37 42 L 41 46 L 48 38" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="96" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Cultura</text>
      <text x="20" y="118" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" font-weight="700" fill="#fcd34d">Digital</text>
      <text x="20" y="154" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">Cidadania, Privacidade,</text>
      <text x="20" y="174" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">Ética &amp; Combate a Phishing</text>
    </g>
  </g>
</svg>
