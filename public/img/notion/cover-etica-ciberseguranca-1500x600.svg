<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" role="img" aria-labelledby="eti-title eti-desc">
  <title id="eti-title">Ética e Cibersegurança — Capa Notion</title>
  <desc id="eti-desc">Capa temática 1500x600 com escudo digital e proteção de dados na zona segura central 900x350.</desc>
  <defs>
    <linearGradient id="bg-eti" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <pattern id="dots-eti" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.4" fill="#fcd34d" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1500" height="600" fill="url(#bg-eti)"/>
  <rect width="1500" height="600" fill="url(#dots-eti)"/>

  <g id="safe-zone" data-safe-area="300 125 900 350">
    <rect x="328" y="168" width="168" height="32" rx="16" fill="#b45309" fill-opacity="0.35" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="412" y="189" text-anchor="middle" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fcd34d">EIXO 3 · BNCC</text>
    <text x="328" y="254" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Ética &amp; Cibersegurança</text>
    <text x="328" y="294" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" fill="#cbd5e1">Cidadania digital, privacidade escolar (LGPD),</text>
    <text x="328" y="320" font-family="Segoe UI, Roboto, system-ui, sans-serif" font-size="18" fill="#cbd5e1">senhas fortes e combate à desinformação.</text>

    <!-- Escudo e Cofre Seguro -->
    <g transform="translate(848, 158)">
      <rect x="0" y="0" width="308" height="280" rx="20" fill="#111827" fill-opacity="0.8" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 154 44 L 222 72 V 134 C 222 180 192 214 154 234 C 116 214 86 180 86 134 V 72 Z" fill="#b45309" fill-opacity="0.22" stroke="#fcd34d" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 126 138 L 146 158 L 186 114" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="74" y="244" width="160" height="22" rx="11" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="154" y="259" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700" fill="#fde68a">LGPD · ART. 14 PROTEGIDO</text>
    </g>
  </g>
</svg>
