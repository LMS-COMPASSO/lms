<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — LMS COMPASSO</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="pagina-login">
    <div class="caixa-login">
      <a href="/" class="login-logo" aria-label="LMS COMPASSO — página inicial">
        <img src="/img/logo.svg" alt="LMS COMPASSO — BNCC Computação">
      </a>
      <h1>Entrar na plataforma</h1>
      <p class="subtitulo">Plataforma de ensino alinhada à BNCC Computação</p>

      <div id="alerta" class="alerta alerta-erro oculto"></div>

      <form id="form-login">
        <div class="form-grupo">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="seuemail@escola.edu.br">
        </div>
        <div class="form-grupo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
      </form>

      <p class="texto-centro mt-18 texto-suave">
        Não tem conta? <a href="/registrar.html" class="link-destaque">Cadastre-se como aluno</a>
      </p>
      <p class="texto-centro mt-8 texto-suave">
        <a href="/" class="link-destaque flex-inline-icon flex-centro"><span class="material-symbols-outlined icon-xs">arrow_back</span> Voltar à página inicial</a>
      </p>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const usuarioLogado = obterToken() ? obterUsuario() : null;
    if (usuarioLogado) {
      window.location.href = usuarioLogado.perfil === 'aluno' ? '/cursos.html' : '/dashboard.html';
    }

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertaEl = document.getElementById('alerta');
      alertaEl.classList.add('oculto');

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      try {
        const resposta = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, senha }),
        });
        salvarSessao(resposta.token, resposta.usuario);
        window.location.href = resposta.usuario.perfil === 'aluno' ? '/cursos.html' : '/dashboard.html';
      } catch (err) {
        alertaEl.textContent = err.message;
        alertaEl.classList.remove('oculto');
      }
    });
  </script>
</body>
</html>
