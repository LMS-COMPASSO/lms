<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos — LMS BNCC Computação</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="conteudo">
      <div id="topbar-container"></div>

      <div class="cartao">
        <div class="flex-entre flex-wrap">
          <div class="flex-linha flex-wrap">
            <select id="filtro-eixo" title="Filtrar por eixo BNCC" aria-label="Filtrar por eixo BNCC">
              <option value="">Todos os eixos BNCC</option>
              <option>Pensamento Computacional</option>
              <option>Mundo Digital</option>
              <option>Cultura Digital</option>
            </select>
            <select id="filtro-status" class="oculto-aluno" title="Filtrar por status do curso" aria-label="Filtrar por status do curso">
              <option value="">Todos os status</option>
              <option value="publicado">Publicado</option>
              <option value="rascunho">Rascunho</option>
            </select>
            <input type="text" id="busca" class="max-w-220" title="Buscar curso por título ou palavra-chave" aria-label="Buscar curso" placeholder="Buscar curso...">
          </div>
          <button type="button" class="btn btn-primario oculto-aluno" onclick="abrirModalCurso()">+ Novo Curso</button>
        </div>
      </div>

      <div id="lista-cursos" class="grid-cursos"></div>
    </main>
  </div>

  <!-- Modal de curso -->
  <div id="modal-curso" class="modal-overlay oculto">
    <div class="modal-conteudo">
      <h3 id="titulo-modal">Novo Curso</h3>
      <form id="form-curso">
        <input type="hidden" id="curso-id">
        <div class="form-grupo">
          <label for="curso-titulo">Título</label>
          <input type="text" id="curso-titulo" placeholder="Ex.: Pensamento Computacional no EF" required>
        </div>
        <div class="form-grupo">
          <label for="curso-descricao">Descrição</label>
          <textarea id="curso-descricao" rows="3" placeholder="Descrição dos objetivos do curso"></textarea>
        </div>
        <div class="grid-2col">
          <div class="form-grupo">
            <label for="curso-eixo">Eixo BNCC</label>
            <select id="curso-eixo" title="Eixo BNCC" required>
              <option value="Pensamento Computacional">Pensamento Computacional</option>
              <option value="Mundo Digital">Mundo Digital</option>
              <option value="Cultura Digital">Cultura Digital</option>
            </select>
          </div>
          <div class="form-grupo">
            <label for="curso-ano">Ano Escolar</label>
            <input type="text" id="curso-ano" placeholder="Ex.: 6º ano EF" required>
          </div>
        </div>
        <div class="form-grupo">
          <label for="curso-carga">Carga Horária (horas)</label>
          <input type="number" id="curso-carga" min="0" value="0" placeholder="0">
        </div>
        <div class="flex-linha mt-16">
          <button type="submit" class="btn btn-primario">Salvar</button>
          <button type="button" class="btn btn-neutro" onclick="fecharModalCurso()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script type="module">
    const usuario = exigirAutenticacao();
    montarLayout('cursos');
    document.getElementById('titulo-pagina').textContent = 'Cursos';

    if (usuario.perfil === 'aluno') {
      document.querySelectorAll('.oculto-aluno').forEach((el) => { el.classList.add('oculto'); });
    }

    function montarQuery() {
      const params = new URLSearchParams();
      const eixo = document.getElementById('filtro-eixo').value;
      const status = document.getElementById('filtro-status').value;
      const busca = document.getElementById('busca').value;
      if (eixo) params.set('eixo_bncc', eixo);
      if (status) params.set('status', status);
      if (busca) params.set('busca', busca);
      return params.toString();
    }

    async function carregarCursos() {
      try {
        const cursos = await api(`/cursos?${montarQuery()}`);
        const container = document.getElementById('lista-cursos');

        if (cursos.length === 0) {
          container.innerHTML = '<p class="texto-suave">Nenhum curso encontrado.</p>';
          return;
        }

        container.innerHTML = cursos.map((c) => {
          const textoBotaoStatus = c.status === 'publicado' ? 'Voltar p/ rascunho' : 'Publicar';
          return `
            <div class="cartao">
              <div class="flex-topo">
                <span class="badge badge-${c.status}">${c.status}</span>
                <span class="texto-suave">${c.carga_horaria}h</span>
              </div>
              <h3 class="mt-8 mb-10">${c.titulo}</h3>
              <p class="texto-suave">${c.descricao || 'Sem descrição.'}</p>
              <p class="texto-suave">
                📘 ${c.eixo_bncc}<br>
                🏫 ${c.ano_escolar} · 👨‍🏫 ${c.instrutor_nome}<br>
                👥 ${c.total_matriculados || 0} matriculado(s)
              </p>
              <div class="flex-linha flex-wrap mt-10">
                <a href="/curso-detalhe.html?id=${c.id}" class="btn btn-neutro btn-sm">Abrir</a>
                ${usuario.perfil !== 'aluno' ? `
                  <button type="button" class="btn btn-neutro btn-sm" onclick='editarCurso(${JSON.stringify(c)})'>Editar</button>
                  <button type="button" class="btn btn-secundario btn-sm" onclick="alternarStatus(${c.id}, '${c.status}')">
                    ${textoBotaoStatus}
                  </button>
                  <button type="button" class="btn btn-perigo btn-sm" onclick="excluirCurso(${c.id})">Excluir</button>
                ` : `
                  <button type="button" class="btn btn-primario btn-sm" onclick="matricular(${c.id})">Matricular-se</button>
                `}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        alert(err.message);
      }
    }

    function abrirModalCurso() {
      document.getElementById('titulo-modal').textContent = 'Novo Curso';
      document.getElementById('form-curso').reset();
      document.getElementById('curso-id').value = '';
      document.getElementById('modal-curso').classList.remove('oculto');
    }
    function fecharModalCurso() {
      document.getElementById('modal-curso').classList.add('oculto');
    }
    function editarCurso(c) {
      document.getElementById('titulo-modal').textContent = 'Editar Curso';
      document.getElementById('curso-id').value = c.id;
      document.getElementById('curso-titulo').value = c.titulo;
      document.getElementById('curso-descricao').value = c.descricao || '';
      document.getElementById('curso-eixo').value = c.eixo_bncc;
      document.getElementById('curso-ano').value = c.ano_escolar;
      document.getElementById('curso-carga').value = c.carga_horaria;
      document.getElementById('modal-curso').classList.remove('oculto');
    }

    document.getElementById('form-curso').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('curso-id').value;
      const corpo = {
        titulo: document.getElementById('curso-titulo').value,
        descricao: document.getElementById('curso-descricao').value,
        eixo_bncc: document.getElementById('curso-eixo').value,
        ano_escolar: document.getElementById('curso-ano').value,
        carga_horaria: Number(document.getElementById('curso-carga').value) || 0,
      };
      try {
        if (id) {
          await api(`/cursos/${id}`, { method: 'PUT', body: JSON.stringify(corpo) });
        } else {
          await api('/cursos', { method: 'POST', body: JSON.stringify(corpo) });
        }
        fecharModalCurso();
        carregarCursos();
      } catch (err) {
        alert(err.message);
      }
    });

    async function alternarStatus(id, statusAtual) {
      const novo = statusAtual === 'publicado' ? 'rascunho' : 'publicado';
      try {
        await api(`/cursos/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status: novo }) });
        carregarCursos();
      } catch (err) { alert(err.message); }
    }

    async function excluirCurso(id) {
      if (!confirm('Tem certeza que deseja excluir este curso? Esta ação não pode ser desfeita.')) return;
      try {
        await api(`/cursos/${id}`, { method: 'DELETE' });
        carregarCursos();
      } catch (err) { alert(err.message); }
    }

    async function matricular(cursoId) {
      try {
        await api('/matriculas', { method: 'POST', body: JSON.stringify({ curso_id: cursoId }) });
        alert('Matrícula realizada com sucesso!');
        window.location.href = `/curso-detalhe.html?id=${cursoId}`;
      } catch (err) { alert(err.message); }
    }

    document.getElementById('filtro-eixo').addEventListener('change', carregarCursos);
    document.getElementById('filtro-status').addEventListener('change', carregarCursos);
    document.getElementById('busca').addEventListener('input', () => {
      clearTimeout(window._t);
      window._t = setTimeout(carregarCursos, 350);
    });

    Object.assign(window, {
      abrirModalCurso,
      fecharModalCurso,
      editarCurso,
      alternarStatus,
      excluirCurso,
      matricular,
    });

    await carregarCursos();
  </script>
</body>
</html>
