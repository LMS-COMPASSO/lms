<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhe do Curso — LMS COMPASSO</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="conteudo">
      <div id="topbar-container"></div>

      <div class="cartao" id="cabecalho-curso"></div>

      <!-- Mapa de Orientação do Curso (Pilar 2: Mostra a trilha completa, onde o aluno está e o que vem a seguir) -->
      <section class="cartao" id="mapa-orientacao-curso" aria-label="Mapa do curso: progresso por etapa"></section>

      <div class="cartao oculto-aluno" id="area-novo-modulo">
        <h3>Adicionar Módulo</h3>
        <div class="flex-linha flex-wrap">
          <input type="text" id="novo-modulo-titulo" placeholder="Título do módulo" title="Título do novo módulo" aria-label="Título do novo módulo" class="flex-1 min-w-200">
          <button type="button" class="btn btn-primario flex-inline-icon" onclick="criarModulo()"><span class="material-symbols-outlined icon-xs">add</span> Adicionar</button>
        </div>
      </div>

      <div id="lista-modulos"></div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script type="module">
    const usuario = exigirAutenticacao();
    montarLayout('cursos');
    document.getElementById('titulo-pagina').textContent = 'Detalhe do Curso';
    if (usuario.perfil === 'aluno') {
      document.querySelectorAll('.oculto-aluno').forEach((el) => { el.classList.add('oculto'); });
    }

    const params = new URLSearchParams(window.location.search);
    const cursoId = params.get('id');

    function renderizarAcaoAula(aula, perfil) {
      if (perfil === 'aluno') {
        const marcado = aula.concluida ? 'checked' : '';
        return `<label class="flex-linha">
          <input type="checkbox" ${marcado} onchange="marcarProgresso(${aula.id}, this.checked)"> Concluída
        </label>`;
      }
      return `<button type="button" class="btn btn-perigo btn-xs" onclick="excluirAula(${aula.id})">Excluir</button>`;
    }

    // Atividades dinâmicas do próprio LMS recebem a aula e o curso para marcar o progresso ao concluir.
    // Links externos só são aceitos com http(s), o que impede endereços como "javascript:".
    function montarLinkAula(aula, idDoCurso) {
      const url = (aula.url_recurso || '').trim();
      if (url.startsWith('/atividades.html')) {
        const separador = url.includes('?') ? '&' : '?';
        return { href: `${url}${separador}aula=${aula.id}&curso=${idDoCurso}`, rotulo: 'Abrir atividade', externo: false };
      }
      if (/^https?:\/\//i.test(url)) return { href: url, rotulo: 'Abrir recurso', externo: true };
      return null;
    }

    function renderizarConteudoAula(aula, idDoCurso) {
      const link = montarLinkAula(aula, idDoCurso);
      const botao = link
        ? `<div class="mt-8"><a class="btn btn-primario btn-xs" href="${escaparHtml(link.href)}"${link.externo ? ' target="_blank" rel="noopener"' : ''}>${link.rotulo}</a></div>`
        : '';
      const descricao = aula.conteudo
        ? `<details class="mt-8"><summary class="texto-suave cursor-pointer">Ver descrição</summary><p class="texto-suave">${escaparHtml(aula.conteudo)}</p></details>`
        : '';
      return botao + descricao;
    }

    function mapearEixoParaSecao(eixoBncc) {
      const val = String(eixoBncc || '').toLowerCase();
      if (val.includes('mundo')) return { secao: 'mundo', rotulo: 'Eixo 2: Mundo Digital', icone: 'memory' };
      if (val.includes('cultura')) return { secao: 'cultura', rotulo: 'Eixo 3: Cultura Digital', icone: 'verified_user' };
      return { secao: 'pensamento', rotulo: 'Eixo 1: Pensamento Computacional', icone: 'format_list_numbered' };
    }

    function renderizarMapaOrientacaoCurso(curso, infoSecao) {
      const mapaEl = document.getElementById('mapa-orientacao-curso');
      if (!mapaEl) return;

      const todasAulas = (curso.modulos || []).flatMap((m) => (m.aulas || []).map((a) => ({ ...a, moduloTitulo: m.titulo })));
      const totalEtapas = todasAulas.length;
      if (totalEtapas === 0) {
        mapaEl.innerHTML = `
          <div class="progresso-etapas-topo">
            <span class="progresso-etapas-contador"><span class="material-symbols-outlined icon-xs" aria-hidden="true">map</span> Mapa do Curso: 0 etapas cadastradas</span>
          </div>
          <p class="texto-suave m-0">Adicione módulos e aulas para visualizar a trilha de marcos do curso.</p>
        `;
        return;
      }

      const concluidas = todasAulas.filter((a) => Boolean(a.concluida)).length;
      const indiceAtual = todasAulas.findIndex((a) => !a.concluida);
      const etapaExibida = indiceAtual === -1 ? totalEtapas : indiceAtual + 1;
      const percentual = Math.round((concluidas / totalEtapas) * 100);
      const aulaAtual = indiceAtual >= 0 ? todasAulas[indiceAtual] : todasAulas[totalEtapas - 1];
      const proximaAula = (indiceAtual >= 0 && indiceAtual + 1 < totalEtapas) ? todasAulas[indiceAtual + 1] : null;

      const marcosHtml = todasAulas.map((aula, idx) => {
        const ehConcluida = Boolean(aula.concluida);
        const ehAqui = idx === indiceAtual || (indiceAtual === -1 && idx === totalEtapas - 1);
        const ehBloqueada = indiceAtual !== -1 && idx > indiceAtual + 1;

        let classeEstado = 'estado-nao-iniciado';
        let iconeEstado = 'circle-dashed';
        let rotuloEstado = 'Não iniciado';

        if (ehConcluida) {
          classeEstado = 'estado-concluido';
          iconeEstado = 'check_circle';
          rotuloEstado = 'Concluído';
        } else if (ehAqui) {
          classeEstado = 'estado-em-andamento';
          iconeEstado = 'schedule';
          rotuloEstado = 'Em andamento (Você está aqui)';
        } else if (ehBloqueada) {
          classeEstado = 'estado-bloqueado';
          iconeEstado = 'lock';
          rotuloEstado = 'Bloqueado (Conclua a etapa anterior)';
        }

        return `
          <li class="trilha-marco-item ${classeEstado}" ${ehAqui ? 'aria-current="step"' : ''} title="Etapa ${idx + 1} de ${totalEtapas}: ${escaparHtml(aula.titulo)} — ${rotuloEstado}">
            <span class="material-symbols-outlined icon-xs" aria-hidden="true">${iconeEstado}</span>
            <span>Etapa ${idx + 1}: ${escaparHtml(aula.titulo)}</span>
          </li>
        `;
      }).join('');

      mapaEl.innerHTML = `
        <div class="progresso-etapas-topo">
          <span class="progresso-etapas-contador">
            <span class="material-symbols-outlined icon-xs" aria-hidden="true">map</span>
            <span>Mapa do Curso — Etapa ${etapaExibida} de ${totalEtapas} (${concluidas}/${totalEtapas} concluídas · ${percentual}%)</span>
          </span>
          <div class="flex-linha flex-wrap gap-8">
            <span class="mapa-tag-aqui"><span class="material-symbols-outlined icon-xs" aria-hidden="true">explore</span> Você está aqui: ${escaparHtml(aulaAtual.titulo)}</span>
            ${proximaAula ? `<span class="mapa-tag-proximo">O que vem a seguir: ${escaparHtml(proximaAula.titulo)} →</span>` : '<span class="estado-progresso-pill estado-concluido"><span class="material-symbols-outlined icon-xs" aria-hidden="true">check_circle</span> Curso Concluído!</span>'}
          </div>
        </div>
        <div class="progresso-etapas-barra" role="progressbar" aria-label="Progresso nas etapas do curso" aria-valuenow="${concluidas}" aria-valuemin="0" aria-valuemax="${totalEtapas}">
          <div class="progresso-etapas-preenchimento" style="width: ${percentual}%"></div>
        </div>
        <ol class="trilha-marcos" aria-label="Etapas e estados das aulas do curso">
          ${marcosHtml}
        </ol>
      `;
    }

    async function carregarCurso() {
      try {
        const curso = await api(`/cursos/${cursoId}`);
        const infoSecao = mapearEixoParaSecao(curso.eixo_bncc);
        document.body.setAttribute('data-secao', infoSecao.secao);
        document.getElementById('titulo-pagina').textContent = curso.titulo;

        document.getElementById('cabecalho-curso').innerHTML = `
          <div class="flex-linha flex-wrap gap-8">
            <span class="secao-pista-badge" data-secao="${infoSecao.secao}">
              <span class="material-symbols-outlined icon-xs" aria-hidden="true">${infoSecao.icone}</span>
              <span>${infoSecao.rotulo}</span>
            </span>
            <span class="badge badge-${curso.status}">${curso.status}</span>
          </div>
          <h2 class="mt-8 mb-10">${escaparHtml(curso.titulo)}</h2>
          <p class="texto-suave">${escaparHtml(curso.descricao || '')}</p>
          <div class="curso-meta-info texto-suave">
            <div><span class="material-symbols-outlined icon-xs">category</span> <span>${escaparHtml(curso.eixo_bncc)}</span> · <span class="material-symbols-outlined icon-xs">school</span> <span>${escaparHtml(curso.ano_escolar)}</span></div>
            <div><span class="material-symbols-outlined icon-xs">schedule</span> <span>${curso.carga_horaria}h</span> · <span class="material-symbols-outlined icon-xs">person</span> <span>${escaparHtml(curso.instrutor_nome)}</span></div>
          </div>
        `;

        renderizarMapaOrientacaoCurso(curso, infoSecao);

        const container = document.getElementById('lista-modulos');
        if (curso.modulos.length === 0) {
          container.innerHTML = `
            <div class="estado-saida-404">
              <div class="estado-saida-icone" aria-hidden="true"><span class="material-symbols-outlined icon-lg">menu_book</span></div>
              <h3>Nenhum módulo cadastrado neste curso ainda</h3>
              <p>Explore as atividades práticas da BNCC Computação ou retorne ao catálogo de cursos.</p>
              <div class="estado-saida-acoes">
                <a href="/cursos.html" class="btn btn-neutro seta-voltar"><span class="material-symbols-outlined icon-xs" aria-hidden="true">arrow_back</span> Voltar para Trilhas</a>
                <a href="/atividades.html" class="btn btn-primario seta-proximo">Ir para Atividades <span class="material-symbols-outlined icon-xs" aria-hidden="true">arrow_forward</span></a>
              </div>
            </div>
          `;
          return;
        }

        container.innerHTML = curso.modulos.map((m) => `
          <div class="cartao">
            <div class="flex-entre">
              <h3>${m.titulo}</h3>
              <button type="button" class="btn btn-perigo btn-xs oculto-aluno" onclick="excluirModulo(${m.id})">Excluir módulo</button>
            </div>
            <p class="texto-suave">${m.descricao || ''}</p>

            <div class="tabela-scroll">
              <table>
                <thead><tr><th>Aula</th><th>Tipo</th><th>Duração</th><th></th></tr></thead>
                <tbody>
                  ${m.aulas.map((a) => `
                    <tr>
                      <td>${a.titulo}${renderizarConteudoAula(a, curso.id)}</td>
                      <td>${a.tipo}</td>
                      <td>${a.duracao_min || 0} min</td>
                      <td>
                        ${renderizarAcaoAula(a, usuario.perfil)}
                      </td>
                    </tr>
                  `).join('') || '<tr><td colspan="4" class="texto-suave">Nenhuma aula cadastrada.</td></tr>'}
                </tbody>
              </table>
            </div>

            <div class="oculto-aluno flex-linha flex-wrap mt-12">
              <input type="text" id="nova-aula-${m.id}" placeholder="Título da nova aula" title="Título da nova aula" aria-label="Título da nova aula" class="flex-1 min-w-160">
              <select id="tipo-aula-${m.id}" title="Tipo de aula" aria-label="Tipo de aula">
                <option value="texto">Texto</option>
                <option value="video">Vídeo</option>
                <option value="pdf">PDF</option>
                <option value="link">Link</option>
              </select>
              <button type="button" class="btn btn-neutro btn-sm flex-inline-icon" onclick="criarAula(${m.id})"><span class="material-symbols-outlined icon-xs">add</span> Aula</button>
            </div>

            ${m.avaliacoes.length > 0 ? `
              <p class="mt-10 texto-suave"><strong>Avaliações:</strong> ${m.avaliacoes.map((av) => av.titulo).join(', ')}</p>
            ` : ''}
          </div>
        `).join('');
      } catch (err) {
        mostrarNotificacao(err.message, 'erro');
      }
    }

    if (usuario.perfil !== 'aluno') {
      document.querySelectorAll('.oculto-aluno').forEach((el) => { el.classList.remove('oculto'); });
    }

    async function criarModulo() {
      const titulo = document.getElementById('novo-modulo-titulo').value.trim();
      if (!titulo) return;
      try {
        await api(`/modulos/curso/${cursoId}`, { method: 'POST', body: JSON.stringify({ titulo }) });
        document.getElementById('novo-modulo-titulo').value = '';
        mostrarNotificacao('Módulo criado com sucesso!', 'sucesso');
        carregarCurso();
      } catch (err) { mostrarNotificacao(err.message, 'erro'); }
    }

    async function excluirModulo(id) {
      if (!confirm('Excluir este módulo e todo seu conteúdo?')) return;
      try {
        await api(`/modulos/${id}`, { method: 'DELETE' });
        mostrarNotificacao('Módulo excluído.', 'info');
        carregarCurso();
      } catch (err) { mostrarNotificacao(err.message, 'erro'); }
    }

    async function criarAula(moduloId) {
      const titulo = document.getElementById(`nova-aula-${moduloId}`).value.trim();
      const tipo = document.getElementById(`tipo-aula-${moduloId}`).value;
      if (!titulo) return;
      try {
        await api(`/aulas/modulo/${moduloId}`, { method: 'POST', body: JSON.stringify({ titulo, tipo }) });
        mostrarNotificacao('Aula adicionada com sucesso!', 'sucesso');
        carregarCurso();
      } catch (err) { mostrarNotificacao(err.message, 'erro'); }
    }

    async function excluirAula(id) {
      if (!confirm('Excluir esta aula?')) return;
      try {
        await api(`/aulas/${id}`, { method: 'DELETE' });
        mostrarNotificacao('Aula excluída.', 'info');
        carregarCurso();
      } catch (err) { mostrarNotificacao(err.message, 'erro'); }
    }

    async function marcarProgresso(aulaId, concluida) {
      try {
        await api(`/aulas/${aulaId}/progresso`, { method: 'POST', body: JSON.stringify({ concluida }) });
        await carregarCurso();
      } catch (err) { mostrarNotificacao(err.message, 'erro'); }
    }

    Object.assign(window, {
      criarModulo,
      excluirModulo,
      criarAula,
      excluirAula,
      marcarProgresso,
    });

    await carregarCurso();
  </script>
</body>
</html>
