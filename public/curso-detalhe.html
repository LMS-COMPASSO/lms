<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhe do Curso — LMS BNCC Computação</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="conteudo">
      <div id="topbar-container"></div>

      <div class="cartao" id="cabecalho-curso"></div>

      <div class="cartao oculto-aluno" id="area-novo-modulo">
        <h3>Adicionar Módulo</h3>
        <div class="flex-linha flex-wrap">
          <input type="text" id="novo-modulo-titulo" placeholder="Título do módulo" title="Título do novo módulo" aria-label="Título do novo módulo" class="flex-1 min-w-200">
          <button type="button" class="btn btn-primario" onclick="criarModulo()">Adicionar</button>
        </div>
      </div>

      <div id="lista-modulos"></div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const usuario = exigirAutenticacao();
    montarLayout('cursos');
    document.getElementById('titulo-pagina').textContent = 'Detalhe do Curso';
    if (usuario.perfil === 'aluno') {
      document.querySelectorAll('.oculto-aluno').forEach((el) => el.classList.add('oculto'));
    }

    const params = new URLSearchParams(window.location.search);
    const cursoId = params.get('id');

    function renderizarAcaoAula(aula, perfil) {
      if (perfil === 'aluno') {
        const marcado = aula.concluida ? 'checked' : '';
        return `<label class="flex-linha">
          <input type="checkbox" ${marcado} onchange="marcarProgresso(${aula.id}, this.checked)"> Concluída
        </label>`;
      }
      return `<button type="button" class="btn btn-perigo btn-xs" onclick="excluirAula(${aula.id})">Excluir</button>`;
    }

    async function carregarCurso() {
      const curso = await api(`/cursos/${cursoId}`);

      document.getElementById('cabecalho-curso').innerHTML = `
        <span class="badge badge-${curso.status}">${curso.status}</span>
        <h2 class="mt-8 mb-10">${curso.titulo}</h2>
        <p class="texto-suave">${curso.descricao || ''}</p>
        <p class="texto-suave">📘 ${curso.eixo_bncc} · 🏫 ${curso.ano_escolar} · ⏱️ ${curso.carga_horaria}h · 👨‍🏫 ${curso.instrutor_nome}</p>
      `;

      const container = document.getElementById('lista-modulos');
      if (curso.modulos.length === 0) {
        container.innerHTML = '<div class="cartao">Nenhum módulo cadastrado ainda.</div>';
        return;
      }

      container.innerHTML = curso.modulos.map((m) => `
        <div class="cartao">
          <div class="flex-entre">
            <h3>${m.titulo}</h3>
            <button type="button" class="btn btn-perigo btn-xs oculto-aluno" onclick="excluirModulo(${m.id})">Excluir módulo</button>
          </div>
          <p class="texto-suave">${m.descricao || ''}</p>

          <table>
            <thead><tr><th>Aula</th><th>Tipo</th><th>Duração</th><th></th></tr></thead>
            <tbody>
              ${m.aulas.map((a) => `
                <tr>
                  <td>${a.titulo}</td>
                  <td>${a.tipo}</td>
                  <td>${a.duracao_min || 0} min</td>
                  <td>
                    ${renderizarAcaoAula(a, usuario.perfil)}
                  </td>
                </tr>
              `).join('') || '<tr><td colspan="4" class="texto-suave">Nenhuma aula cadastrada.</td></tr>'}
            </tbody>
          </table>

          <div class="oculto-aluno flex-linha flex-wrap mt-12">
            <input type="text" id="nova-aula-${m.id}" placeholder="Título da nova aula" title="Título da nova aula" aria-label="Título da nova aula" class="flex-1 min-w-160">
            <select id="tipo-aula-${m.id}" title="Tipo de aula" aria-label="Tipo de aula">
              <option value="texto">Texto</option>
              <option value="video">Vídeo</option>
              <option value="pdf">PDF</option>
              <option value="link">Link</option>
            </select>
            <button type="button" class="btn btn-neutro btn-sm" onclick="criarAula(${m.id})">+ Aula</button>
          </div>

          ${m.avaliacoes.length > 0 ? `
            <p class="mt-10 texto-suave"><strong>Avaliações:</strong> ${m.avaliacoes.map((av) => av.titulo).join(', ')}</p>
          ` : ''}
        </div>
      `).join('');
    }

    if (usuario.perfil !== 'aluno') {
      document.querySelectorAll('.oculto-aluno').forEach((el) => el.classList.remove('oculto'));
    }

    async function criarModulo() {
      const titulo = document.getElementById('novo-modulo-titulo').value.trim();
      if (!titulo) return;
      try {
        await api(`/modulos/curso/${cursoId}`, { method: 'POST', body: JSON.stringify({ titulo }) });
        document.getElementById('novo-modulo-titulo').value = '';
        carregarCurso();
      } catch (err) { alert(err.message); }
    }

    async function excluirModulo(id) {
      if (!confirm('Excluir este módulo e todo seu conteúdo?')) return;
      try {
        await api(`/modulos/${id}`, { method: 'DELETE' });
        carregarCurso();
      } catch (err) { alert(err.message); }
    }

    async function criarAula(moduloId) {
      const titulo = document.getElementById(`nova-aula-${moduloId}`).value.trim();
      const tipo = document.getElementById(`tipo-aula-${moduloId}`).value;
      if (!titulo) return;
      try {
        await api(`/aulas/modulo/${moduloId}`, { method: 'POST', body: JSON.stringify({ titulo, tipo }) });
        carregarCurso();
      } catch (err) { alert(err.message); }
    }

    async function excluirAula(id) {
      if (!confirm('Excluir esta aula?')) return;
      try {
        await api(`/aulas/${id}`, { method: 'DELETE' });
        carregarCurso();
      } catch (err) { alert(err.message); }
    }

    async function marcarProgresso(aulaId, concluida) {
      try {
        await api(`/aulas/${aulaId}/progresso`, { method: 'POST', body: JSON.stringify({ concluida }) });
      } catch (err) { alert(err.message); }
    }

    carregarCurso().catch((e) => alert(e.message));
  </script>
</body>
</html>
