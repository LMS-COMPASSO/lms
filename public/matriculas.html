<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrículas — LMS COMPASSO</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="conteudo">
      <div id="topbar-container"></div>
      <div class="cartao tabela-scroll" tabindex="0" role="region" aria-label="Tabela de matrículas de estudantes">
        <table aria-label="Lista de matrículas de estudantes">
          <thead>
            <tr>
              <th scope="col">Aluno</th><th scope="col">Curso</th><th scope="col">Status</th><th scope="col">Progresso</th><th scope="col">Data</th><th scope="col" class="texto-direita">Ações</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script type="module">
    const usuario = exigirAutenticacao();
    montarLayout('matriculas');
    document.getElementById('titulo-pagina').textContent = 'Matrículas';

    async function carregar() {
      try {
        const matriculas = await api('/matriculas');
        const corpo = document.getElementById('corpo-tabela');

        if (matriculas.length === 0) {
          corpo.innerHTML = '<tr><td colspan="6" class="texto-suave">Nenhuma matrícula encontrada.</td></tr>';
          return;
        }

        corpo.innerHTML = matriculas.map((m) => {
          const id = Number(m.id);
          const status = ['ativa', 'concluida', 'cancelada'].includes(m.status) ? m.status : 'ativa';
          const progresso = Math.min(100, Math.max(0, Number(m.progresso_percentual) || 0));
          return `
          <tr>
            <td>${escaparHtml(m.aluno_nome)}<br><small class="texto-suave">${escaparHtml(m.aluno_email)}</small></td>
            <td>${escaparHtml(m.curso_titulo)}</td>
            <td><span class="badge badge-${status}">${escaparHtml(status)}</span></td>
            <td class="min-w-160">
              <div class="progress-bar"><div class="progress-bar-fill" style="width:${progresso}%;"></div></div>
              <small>${progresso}%</small>
            </td>
            <td>${formatarData(m.data_matricula)}</td>
            <td class="texto-direita">
              ${status !== 'cancelada' ? `<button type="button" class="btn btn-perigo btn-xs" aria-label="Cancelar matrícula de ${escaparHtml(m.aluno_nome)}" data-cancelar-id="${id}">Cancelar</button>` : ''}
              ${status === 'concluida' ? `<button type="button" class="btn btn-secundario btn-xs" aria-label="Emitir certificado para ${escaparHtml(m.aluno_nome)}" data-certificado-id="${id}">Certificado</button>` : ''}
            </td>
          </tr>
        `;
        }).join('');
      } catch (err) {
        mostrarNotificacao(err.message, 'erro');
      }
    }

    async function cancelar(id) {
      if (!confirm('Cancelar esta matrícula?')) return;
      try {
        await api(`/matriculas/${id}/cancelar`, { method: 'PATCH' });
        mostrarNotificacao('Matrícula cancelada.', 'info');
        carregar();
      } catch (err) { mostrarNotificacao(err.message, 'erro'); }
    }

    async function emitirCertificado(matriculaId) {
      try {
        const cert = await api('/certificados/emitir', { method: 'POST', body: JSON.stringify({ matricula_id: matriculaId }) });
        mostrarNotificacao('Certificado emitido com sucesso!', 'sucesso');
        if (typeof cert.url_arquivo === 'string' && cert.url_arquivo.startsWith('/api/certificados/')) {
          window.open(cert.url_arquivo, '_blank', 'noopener,noreferrer');
        }
      } catch (err) { mostrarNotificacao(err.message, 'erro'); }
    }

    document.getElementById('corpo-tabela')?.addEventListener('click', (event) => {
      const btnCancelar = event.target.closest('button[data-cancelar-id]');
      if (btnCancelar) {
        cancelar(Number(btnCancelar.dataset.cancelarId));
        return;
      }
      const btnCertificado = event.target.closest('button[data-certificado-id]');
      if (btnCertificado) {
        emitirCertificado(Number(btnCertificado.dataset.certificadoId));
      }
    });

    Object.assign(window, {
      cancelar,
      emitirCertificado,
    });

    await carregar();
  </script>
</body>
</html>
