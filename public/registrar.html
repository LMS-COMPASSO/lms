<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — LMS COMPASSO</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="pagina-login">
    <div class="caixa-login">
      <a href="/" class="login-logo" aria-label="LMS COMPASSO — página inicial">
        <img src="/img/logo.svg" alt="LMS COMPASSO — BNCC Computação">
      </a>
      <h1>Criar Conta</h1>
      <p class="subtitulo">Cadastro de novo aluno na plataforma</p>

      <div id="alerta" class="alerta alerta-erro oculto"></div>

      <form id="form-registro">
        <div class="form-grupo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Seu nome completo" required>
        </div>
        <div class="form-grupo">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="seuemail@escola.edu.br" required>
        </div>
        <div class="form-grupo">
          <label for="senha">Senha (mín. 6 caracteres)</label>
          <input type="password" id="senha" autocomplete="new-password" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn btn-secundario btn-bloco">Criar conta</button>
      </form>

      <p class="texto-centro mt-18 texto-suave">
        Já tem conta? <a href="/login.html" class="link-destaque">Fazer login</a>
      </p>
      <p class="texto-centro mt-8 texto-suave">
        <a href="/" class="link-destaque flex-inline-icon flex-centro"><span class="material-symbols-outlined icon-xs">arrow_back</span> Voltar à página inicial</a>
      </p>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertaEl = document.getElementById('alerta');
      alertaEl.classList.add('oculto');

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      try {
        const resposta = await api('/auth/registrar', {
          method: 'POST',
          body: JSON.stringify({ nome, email, senha }),
        });
        salvarSessao(resposta.token, resposta.usuario);
        window.location.href = '/cursos.html';
      } catch (err) {
        alertaEl.textContent = err.message;
        alertaEl.classList.remove('oculto');
      }
    });
  </script>
</body>
</html>
