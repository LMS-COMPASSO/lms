name: Monitoramento Periódico — Links e Segurança de Dependências

on:
  schedule:
    # Executa toda segunda-feira às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Permite disparo manual sob demanda pela UI do GitHub

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. VERIFICAÇÃO DE VULNERABILIDADES EM DEPENDÊNCIAS (NPM AUDIT)
  # ============================================================================
  auditoria-dependencias:
    name: Auditoria de Vulnerabilidades npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Checagem de vulnerabilidades conhecidas (npm audit)
        id: npm-audit
        run: |
          npm audit --audit-level=high || echo "audit_failed=true" >> "$GITHUB_OUTPUT"

      - name: Atualizar ou fechar Issue automática de vulnerabilidades npm
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          AUDIT_FAILED: ${{ steps.npm-audit.outputs.audit_failed }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['segurança'],
            });
            const existentes = issues.filter(i => i.title.includes('[Segurança] Vulnerabilidades identificadas'));

            if (process.env.AUDIT_FAILED === 'true') {
              if (existentes.length === 0) {
                const corpo = [
                  'O monitoramento semanal detectou vulnerabilidades com nível **high** ou **critical** nas dependências do projeto.',
                  '',
                  '### Ações Recomendadas:',
                  '1. Executar localmente: `npm audit` para inspecionar os pacotes afetados.',
                  '2. Executar: `npm audit fix` ou atualizar manualmente as versões no `package.json`.',
                  '3. Validar se há updates pendentes abertos pelo Dependabot.',
                ].join('\n');
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '🚨 [Segurança] Vulnerabilidades identificadas em dependências (npm audit)',
                  body: corpo,
                  labels: ['segurança', 'manutenção'],
                });
              }
            } else {
              for (const issue of existentes) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '✅ Encerrada automaticamente: nenhuma vulnerabilidade `high` ou `critical` encontrada pelo `npm audit`.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }

  # ============================================================================
  # 2. VERIFICAÇÃO DE LINKS QUEBRADOS (LYCHEE)
  # ============================================================================
  verificar-links:
    name: Verificação de Links Quebrados (Lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checagem de integridade de links internos e externos
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Ignora links de exemplo locais/privados, domínio de produção e rotas de API dinâmicas
          args: >-
            --verbose
            --no-progress
            --root-dir public
            --exclude '^http://localhost'
            --exclude '^http://127.0.0.1'
            --exclude '^https://lms.thedelacosta.workers.dev'
            --exclude '^https://dash\.cloudflare\.com/?$'
            --exclude '/api/'
            public/**/*.html *.md docs/**/*.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar ou fechar Issue de links quebrados
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const exitCode = String(process.env.LYCHEE_EXIT_CODE || '0');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['bug', 'documentação'],
            });
            const existentes = issues.filter(i => i.title.includes('[Monitoramento] Links quebrados detectados'));

            if (exitCode !== '0') {
              const report = fs.existsSync('lychee/out.md')
                ? fs.readFileSync('lychee/out.md', 'utf8').trim()
                : 'Links com erro encontrados nos arquivos do repositório.';
              if (existentes.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '🔗 [Monitoramento] Links quebrados detectados no projeto',
                  body: `### Relatório Semanal de Links Quebrados\n\nForam identificados links inacessíveis ou quebrados nos arquivos HTML/Markdown do LMS.\n\n\`\`\`\n${report.slice(0, 3000)}\n\`\`\``,
                  labels: ['bug', 'documentação'],
                });
              }
            } else {
              for (const issue of existentes) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '✅ Encerrada automaticamente: verificação semanal do Lychee concluída sem links quebrados.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }
