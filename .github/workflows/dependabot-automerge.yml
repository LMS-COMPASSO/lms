name: Dependabot — Auto-merge Restrito

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge-dependabot:
    name: Avaliar e habilitar auto-merge para Dependabot
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.id == 49699333 && github.event.pull_request.user.type == 'Bot'
    steps:
      - name: Obter metadados da atualização do Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aprovar e habilitar auto-merge para atualizações patch ou minor
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

