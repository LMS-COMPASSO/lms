name: Dependabot — Auto-merge Restrito

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge-dependabot:
    name: Avaliar e habilitar auto-merge para Dependabot
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.id == 49699333 && github.event.pull_request.user.type == 'Bot'
    steps:
      - name: Obter metadados da atualização do Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aprovar e habilitar auto-merge para atualizações patch ou minor
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
          AUTO_MERGE_ENABLED=$(gh api "repos/${{ github.repository }}" --jq '.allow_auto_merge')
          if [ "$AUTO_MERGE_ENABLED" = "true" ]; then
            if ! SAIDA_MERGE=$(gh pr merge --auto --merge "$PR_URL" 2>&1); then
              if echo "$SAIDA_MERGE" | grep -qiE "clean status|auto merge is not allowed"; then
                echo "::notice::Auto-merge não aplicável no estado atual da branch ($SAIDA_MERGE); PR aprovado para revisão/merge após o CI."
              else
                echo "$SAIDA_MERGE" >&2
                exit 1
              fi
            fi
          else
            echo "::notice::Auto-merge desabilitado nas configurações do repositório; PR aprovado para revisão/merge após os checks do CI."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

