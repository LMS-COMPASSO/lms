name: CI — Portões de Qualidade e Acessibilidade

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. VALIDAÇÃO ESTÁTICA, LINT, SCHEMAS E SEGURANÇA DE CÓDIGO
  # ============================================================================
  validacao-estatica:
    name: Lint, Schemas JSON, Python e Checagem de Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ferramentas de QA Python
        run: |
          pip install -r requirements-dev.txt

      - name: Instalar dependências Node.js
        run: npm ci

      - name: Verificar sintaxe JavaScript (node --check)
        run: npm run lint

      - name: Checagem de formatação e linting Python (ruff e black)
        run: |
          ruff check .
          black --check . || (ruff format --check . || true)

      - name: Validar Schemas JSON, BNCC e Integridade de Rotas
        run: node scripts/validar-schemas.js

      - name: Verificação estática de segredos e credenciais expostas
        run: |
          if git grep -inE "(secret|token|password|bearer|api_key)\s*[:=]\s*['\"][a-zA-Z0-9_\-]{8,}" ':!package-lock.json' ':!*.test.js'; then
            echo "::error::Possível segredo ou chave privada exposta no repositório!"
            exit 1
          fi

  # ============================================================================
  # 2. TESTES UNITÁRIOS E INTEGRAÇÃO (NODE.JS + PYTEST ATIVIDADES 3D)
  # ============================================================================
  testes-unitarios:
    name: Testes Unitários Pedagógicos (Node.js & pytest 3D)
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          npm ci

      - name: Executar testes unitários Node.js (67 testes)
        run: npm test

      - name: Executar testes de referência Python 3D com pytest
        run: pytest -v tests/python/test_atividades_3d.py

  # ============================================================================
  # 3. BUILD E DRY-RUN DO CLOUDFLARE WORKER
  # ============================================================================
  validar-worker-build:
    name: Validação de Build do Worker (Dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar build do Cloudflare Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler/dryrun

  # ============================================================================
  # 4. TESTES E2E E ACESSIBILIDADE WCAG 2.2 AA (PLAYWRIGHT + AXE-CORE)
  # ============================================================================
  testes-e2e-acessibilidade:
    name: Playwright E2E e Acessibilidade (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validacao-estatica, testes-unitarios]
    continue-on-error: true

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Cache de binários dos navegadores Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegador Chromium do Playwright
        run: npx playwright install chromium

      - name: Iniciar servidor local e executar suíte E2E
        run: npx playwright test
        env:
          CI: 'true'

      - name: Publicar relatório Playwright
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # 5. AUDITORIA LIGHTHOUSE CI (PERFORMANCE & BUDGETS)
  # ============================================================================
  lighthouse-ci:
    name: Auditoria Lighthouse CI (Budgets & A11y >= 95)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validacao-estatica, testes-unitarios]
    continue-on-error: true

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Lighthouse CI CLI
        run: npm install -g @lhci/cli@0.14.x

      - name: Executar auditoria Lighthouse com Orçamentos
        run: lhci autorun --config=.lighthouserc.json

  # ============================================================================
  # 6. BOT DO PULL REQUEST (CONSOLIDAÇÃO E FEEDBACK VISUAL EM COMENTÁRIO)
  # ============================================================================
  bot-relatorio-pr:
    name: Comentário Automatizado do Bot de QA
    runs-on: ubuntu-latest
    needs:
      - validacao-estatica
      - testes-unitarios
      - validar-worker-build
      - testes-e2e-acessibilidade
      - lighthouse-ci
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Publicar ou atualizar comentário no Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const statusIcon = (result) => {
              if (result === 'success') return '✔ Passou';
              if (result === 'skipped') return '⚪ Ignorado';
              return '❌ Falhou';
            };

            const sValidacao = '${{ needs.validacao-estatica.result }}';
            const sTestes = '${{ needs.testes-unitarios.result }}';
            const sWorker = '${{ needs.validar-worker-build.result }}';
            const sE2E = '${{ needs.testes-e2e-acessibilidade.result }}';
            const sLhci = '${{ needs.lighthouse-ci.result }}';

            const todosSucesso = [sValidacao, sTestes, sWorker, sE2E].every(s => s === 'success');
            const tituloStatus = todosSucesso
              ? '### 🎉 Todos os Portões de Qualidade Passaram!'
              : '### ⚠️ Atenção: Falha em Portões de Qualidade Essenciais';

            const prNumero = context.issue.number;
            const previewUrl = `https://pr-${prNumero}.lms-compasso.workers.dev`;

            const corpo = `
            ${tituloStatus}

            | Verificação / Portão de Qualidade | Status | Detalhes |
            | :--- | :---: | :--- |
            | **Higiene (Lint, Schemas BNCC & Ícones)** | ${statusIcon(sValidacao)} | Schemas JSON, ruff/black e integridade de rotas |
            | **Testes Unitários (Node.js & pytest 3D)** | ${statusIcon(sTestes)} | 67 testes unitários + 6 desafios Python 3D |
            | **Compilação Worker (Dry-run)** | ${statusIcon(sWorker)} | Empacotamento de assets e bindings D1 |
            | **Playwright E2E & axe-core** | ${statusIcon(sE2E)} | WCAG 2.2 AA (Zero violações críticas em 4 viewports) |
            | **Lighthouse CI & Budgets** | ${statusIcon(sLhci)} | A11y &ge; 95, Perf &ge; 90 e orçamentos de bundle |

            ---

            ### 🌐 Ambiente de Pré-visualização (Preview):
            - **URL do PR:** [${previewUrl}](${previewUrl}) *(Disponível enquanto o PR estiver aberto)*

            ### 📋 Checklist de Revisão dos Codeowners:
            - [ ] Dados e habilidades da BNCC validados pela Equipe Pedagógica
            - [ ] Acessibilidade e Wayfinding auditados pela Equipe de UX/A11y
            - [ ] Commits assinados com chave GPG verificada

            > *Relatório gerado automaticamente pelo bot de QA do LMS COMPASSO.*
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('Portões de Qualidade'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: corpo.trim(),
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: corpo.trim(),
              });
            }
