name: CodeQL — Análise Estática de Segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Executa todo domingo às 03:00 UTC
    - cron: '0 3 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analisar (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Executar Análise CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

