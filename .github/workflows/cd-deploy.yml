name: CD — Publicação Segura na Produção (Cloudflare Workers + D1)

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy-producao:
    name: Publicar no Cloudflare Workers & D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://lms-compasso.workers.dev

    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Executar validação pré-deploy (npm test)
        run: npm test

      - name: Validar presença das credenciais Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::O segredo CLOUDFLARE_API_TOKEN está vazio ou não configurado nas Secrets do repositório/ambiente no GitHub!"
            echo "::notice::Configure em: GitHub > Settings > Secrets and variables > Actions > New repository secret (CLOUDFLARE_API_TOKEN)"
            exit 1
          fi

      - name: Detectar se houve alterações no schema SQL do D1
        id: check-d1
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^d1/schema.sql$"; then
            echo "schema_alterado=true" >> "$GITHUB_OUTPUT"
            echo "Detectada alteração em d1/schema.sql — Migração D1 será executada."
          else
            echo "schema_alterado=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aplicar migrações remotas no Cloudflare D1
        if: steps.check-d1.outputs.schema_alterado == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute lms_prod --remote --file=./d1/schema.sql

      - name: Publicar Worker e Ativos Estáticos
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Health check pós-deploy (verificação de integridade da API)
        run: |
          echo "Aguardando propagação da borda..."
          sleep 5
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://lms-compasso.workers.dev/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✔ Health check passou com sucesso! API online e operacional."
              exit 0
            fi
            echo "Tentativa $i falhou (Status: $STATUS). Aguardando nova tentativa..."
            sleep 4
          done
          echo "::warning::Health check não respondeu 200 no tempo esperado. Verifique o dashboard da Cloudflare."

