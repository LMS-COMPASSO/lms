name: Rotulagem Automática de PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  rotular:
    name: Classificar PR por área e tamanho
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aplicar rótulos baseados em arquivos alterados
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Aplicar rótulo de tamanho do PR (size/XS a size/XL)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const mudancas = pr.additions + pr.deletions;
            let rotuloTamanho = 'size/M';

            if (mudancas < 20) {
              rotuloTamanho = 'size/XS';
            } else if (mudancas < 100) {
              rotuloTamanho = 'size/S';
            } else if (mudancas < 500) {
              rotuloTamanho = 'size/M';
            } else if (mudancas < 1000) {
              rotuloTamanho = 'size/L';
            } else {
              rotuloTamanho = 'size/XL';
            }

            const rotulosTamanhoPossiveis = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];
            const rotulosAtuais = pr.labels.map(l => l.name);

            // Remove rótulo de tamanho anterior se houver
            for (const r of rotulosTamanhoPossiveis) {
              if (r !== rotuloTamanho && rotulosAtuais.includes(r)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: r,
                }).catch(() => {});
              }
            }

            // Adiciona o rótulo de tamanho correto
            if (!rotulosAtuais.includes(rotuloTamanho)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [rotuloTamanho],
              });
            }
