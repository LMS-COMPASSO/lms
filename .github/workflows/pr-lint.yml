name: Validação de Conventional Commits (PR)

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

jobs:
  validar-titulo-pr:
    name: Validar Conventional Commits no Título do PR
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z0-9].+$
          subjectPatternError: O título do PR deve iniciar com letra minúscula após o tipo/escopo. Exemplo: 'feat(atividades): adicionar labirinto 3d'.

